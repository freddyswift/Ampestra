name: Ampestra

options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 2
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    DEVELOPMENT_TEAM: 3VNW72P883
    CODE_SIGN_STYLE: Automatic
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    SWIFT_EMIT_LOC_STRINGS: YES
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  KEFCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/KEFCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freddyswift.ampestra.kefcore
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES

  AmpestraWidgets:
    type: app-extension
    platform: iOS
    productName: AmpestraWidgets
    sources:
      - path: iOS/AmpestraWidgets
        excludes:
          - Info.plist
          - AmpestraWidgets.entitlements
      - path: iOS/AmpestraShared
      - path: iOS/AmpestraMobile/SpeakerPreferences.swift
      - path: iOS/AmpestraMobile/SavedSpeakerStore.swift
      - path: iOS/AmpestraMobile/SpeakerCommandService.swift
    dependencies:
      - target: KEFCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freddyswift.ampestra.widgets
        PRODUCT_NAME: AmpestraWidgets
        INFOPLIST_FILE: iOS/AmpestraWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: iOS/AmpestraWidgets/AmpestraWidgets.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  AmpestraMobile:
    type: application
    platform: iOS
    productName: Ampestra
    sources:
      - path: iOS/AmpestraMobile
        excludes:
          - Info.plist
          - AmpestraMobile.entitlements
      - path: iOS/AmpestraShared
    resources:
      - path: iOS/AmpestraMobile/Assets.xcassets
    dependencies:
      - target: KEFCore
      - target: AmpestraWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freddyswift.ampestra
        PRODUCT_NAME: Ampestra
        PRODUCT_MODULE_NAME: AmpestraMobile
        INFOPLIST_FILE: iOS/AmpestraMobile/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: iOS/AmpestraMobile/AmpestraMobile.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_CFBundleDisplayName: Ampestra

  AmpestraMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: iOS/AmpestraMobileTests
    dependencies:
      - target: AmpestraMobile
      - target: KEFCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freddyswift.ampestra.tests
        GENERATE_INFOPLIST_FILE: YES

  AmpestraMobileIntentTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: iOS/AmpestraMobileIntentTests
    dependencies:
      - target: AmpestraMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freddyswift.ampestra.intent-tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Ampestra iOS:
    build:
      targets:
        KEFCore: all
        AmpestraWidgets: all
        AmpestraMobile: all
        AmpestraMobileTests: [test]
        AmpestraMobileIntentTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: AmpestraMobileTests
          parallelizable: false
        - name: AmpestraMobileIntentTests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
