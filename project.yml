name: Ampestra

options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    DEVELOPMENT_TEAM: 3VNW72P883
    CODE_SIGN_STYLE: Automatic
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    SWIFT_EMIT_LOC_STRINGS: YES
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  KEFCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/KEFCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freddyswift.ampestra.kefcore
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES

  AmpestraMobile:
    type: application
    platform: iOS
    productName: Ampestra
    sources:
      - path: iOS/AmpestraMobile
        excludes:
          - Info.plist
    resources:
      - path: iOS/AmpestraMobile/Assets.xcassets
    dependencies:
      - target: KEFCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freddyswift.ampestra
        PRODUCT_NAME: Ampestra
        PRODUCT_MODULE_NAME: AmpestraMobile
        INFOPLIST_FILE: iOS/AmpestraMobile/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: 1.0.4
        CURRENT_PROJECT_VERSION: 5
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_CFBundleDisplayName: Ampestra

  AmpestraMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: iOS/AmpestraMobileTests
    dependencies:
      - target: AmpestraMobile
      - target: KEFCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freddyswift.ampestra.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Ampestra iOS:
    build:
      targets:
        KEFCore: all
        AmpestraMobile: all
        AmpestraMobileTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: AmpestraMobileTests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
